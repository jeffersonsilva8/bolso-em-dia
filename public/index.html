<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Bolso em Dia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E6B4F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de celular numa coluna só (máx. 520px), barra de abas embaixo, folhas que sobem de baixo para lançar e editar. */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --surface-2:#F5F8F5; --line:#DCE4DE;
  --ink:#0F2219; --ink-2:#4A5D53; --ink-3:#7D8E85;
  --money:#0E6B4F; --money-2:#14946C; --money-soft:#D9EFE5;
  --spend:#E4573F; --spend-soft:#FBE3DD;
  --gold:#D99A1E; --gold-soft:#FBEFD3;
  --warn:#C77A0A; --crit:#C93A2A; --ok:#14946C;
  --hero-a:#0E6B4F; --hero-b:#0A4A37; --hero-ink:#F2FBF6;
  --shadow:0 1px 2px rgba(15,34,25,.06),0 8px 24px rgba(15,34,25,.07);
  --f-display:"Bricolage Grotesque","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08110D; --surface:#111D18; --surface-2:#16251F; --line:#22352C;
  --ink:#E8F2EC; --ink-2:#A9BDB2; --ink-3:#73897D;
  --money:#3CCB97; --money-2:#3CCB97; --money-soft:#123326;
  --spend:#FF7A63; --spend-soft:#3A1C16;
  --gold:#F2B64A; --gold-soft:#3A2C10;
  --warn:#F2B64A; --crit:#FF7A63; --ok:#3CCB97;
  --hero-a:#0F5A43; --hero-b:#0A3829; --hero-ink:#F2FBF6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08110D; --surface:#111D18; --surface-2:#16251F; --line:#22352C;
  --ink:#E8F2EC; --ink-2:#A9BDB2; --ink-3:#73897D;
  --money:#3CCB97; --money-2:#3CCB97; --money-soft:#123326;
  --spend:#FF7A63; --spend-soft:#3A1C16;
  --gold:#F2B64A; --gold-soft:#3A2C10;
  --warn:#F2B64A; --crit:#FF7A63; --ok:#3CCB97;
  --hero-a:#0F5A43; --hero-b:#0A3829; --hero-ink:#F2FBF6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--money-2);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--money);display:grid;place-items:center;color:#fff;font-size:16px;box-shadow:0 4px 12px color-mix(in srgb,var(--money) 35%,transparent)}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;width:32px;height:32px;border-radius:999px;font-size:18px;color:var(--ink-2)}
.month button:hover{background:var(--surface-2)}
.month span{font-weight:700;font-size:13.5px;min-width:96px;text-align:center;text-transform:capitalize}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--gold-soft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner button{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 12px;font-weight:700;font-size:12.5px;white-space:nowrap}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 18px;color:var(--hero-ink);background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--hero-a) 70%,#fff 8%) 0%,var(--hero-a) 40%,var(--hero-b) 100%);box-shadow:0 14px 40px color-mix(in srgb,var(--hero-b) 40%,transparent)}
.hero.neg{background:radial-gradient(120% 90% at 100% 0%,#C9503B 0%,#A8392A 45%,#6F2016 100%)}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.06)}
.hero-row{display:flex;justify-content:space-between;gap:12px;align-items:center;position:relative;z-index:1}
.hero small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-weight:700}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,10vw,44px);letter-spacing:-.03em;line-height:1.05;margin-top:6px}
.hero .sub{margin-top:8px;font-size:13.5px;opacity:.92}
.hero .sub b{font-weight:800}
.ring{flex:none;width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1}
.ring .pct em{display:block;font-style:normal;font-family:var(--f-body);font-size:10px;font-weight:700;opacity:.8;letter-spacing:.06em;margin-top:3px}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.14);margin-top:18px;position:relative;z-index:1}
.stack i{display:block;height:100%;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;position:relative;z-index:1}
.legend div{font-size:11px;opacity:.95;min-width:0}
.legend div b{display:block;font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;min-width:0}
button.stat:hover{border-color:var(--money-2)}
.stat small{display:block;font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.stat b{display:block;font-family:var(--f-display);font-size:17px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.stat .edit{font-size:11px;color:var(--money-2);font-weight:700}

section.blk{margin-top:22px}
.blk-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.blk-h h2{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.link{border:0;background:none;color:var(--money-2);font-weight:800;font-size:13px;padding:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* alerts */
.alerts{display:grid;gap:8px;margin-top:12px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:14px;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn)}
.alert.crit{border-left-color:var(--crit);background:var(--spend-soft)}
.alert.ok{border-left-color:var(--ok)}
.alert .ic{font-size:17px;line-height:1.2}

/* lists */
.list{display:grid}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:transparent;width:100%;text-align:left;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
button.item:hover{background:var(--surface-2)}
.emo{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;background:var(--surface-2)}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.item .v{font-family:var(--f-display);font-weight:800;white-space:nowrap}
.v.out{color:var(--ink)} .v.in{color:var(--money-2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2)}
.bank-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.day-h{font-size:12px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;padding:14px 4px 6px;display:flex;justify-content:space-between}

/* fixed checklist */
.fxrow{display:flex;align-items:center;border-top:1px solid var(--line)}.fxrow:first-child{border-top:0}.fxrow .item{border-top:0;flex:1;min-width:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.fxmore{flex:none;width:40px;height:44px;margin-right:6px;border:0;background:transparent;border-radius:10px;color:var(--ink-3);font-size:20px;font-weight:900;cursor:pointer}.fxmore:hover{background:var(--surface-2);color:var(--ink)}
.item.pressing{transform:scale(.98);background:var(--surface-2);transition:transform .45s}
.delopts{display:grid;gap:8px;background:var(--surface-2);border-radius:14px;padding:12px}.delopts>b{font-size:14px}.delopts .btn{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}.delopts .btn small{font-weight:600;font-size:12px;opacity:.75}
.fxend{background:var(--surface-2);border-radius:14px;padding:12px;margin-top:12px}.fxend b{display:block;font-size:14px;margin-bottom:4px}.fxend .hint{display:block;margin-bottom:10px}
.tagend{font-size:11px;font-weight:800;color:var(--spend);background:var(--spend-soft);border-radius:6px;padding:1px 6px}
.check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-weight:900;font-size:14px;transition:.2s}
.paid .check{background:var(--money-2);border-color:var(--money-2);color:#fff;transform:scale(1.05)}
.paid .t{text-decoration:line-through;color:var(--ink-3)}

/* category bars */
.cats{padding:6px 14px 12px}
.cat{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 0}
.cat .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.cat .bar i{display:block;height:100%;border-radius:99px;background:var(--spend);transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.cat .n{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.cat .n span{color:var(--ink-3);font-weight:600;font-size:12px}
@keyframes grow{from{transform:scaleX(0)}}

/* cards */
.ccards{display:grid;gap:14px}
.cc{position:relative;border-radius:22px;padding:18px;color:#fff;overflow:hidden;min-height:180px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 30px rgba(0,0,0,.18);border:0;text-align:left;width:100%}
.cc::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 100% 0%,rgba(255,255,255,.28),transparent 60%),linear-gradient(160deg,rgba(255,255,255,.08),rgba(0,0,0,.25))}
.cc>*{position:relative}
.cc .bk{font-family:var(--f-display);font-weight:800;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.cc .chipc{width:38px;height:28px;border-radius:7px;background:linear-gradient(135deg,#f6dd9a,#c9a24b);opacity:.95}
.cc .lim{font-size:12px;opacity:.85}
.cc .lv{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.cc .ub{height:7px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:8px}
.cc .ub i{display:block;height:100%;background:#fff;border-radius:99px}
.cc .meta{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;opacity:.9;margin-top:8px;flex-wrap:wrap}
.cc.light{color:#1a1a1a}.cc.light .ub{background:rgba(0,0,0,.15)}.cc.light .ub i{background:#1a1a1a}

.empty{padding:26px 18px;text-align:center;color:var(--ink-2)}
.empty .e-ic{font-size:30px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin:6px 0 4px}

/* goal */
.gold-hero{border-radius:24px;padding:20px;background:linear-gradient(150deg,var(--gold-soft),var(--surface));border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line))}
.gold-hero small{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.gold-hero .big{font-family:var(--f-display);font-weight:800;font-size:38px;letter-spacing:-.03em;margin-top:4px}
.range{width:100%;accent-color:var(--gold);margin:14px 0 4px;height:28px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-weight:700;font-size:13px}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:16px 14px 8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .b i{display:block;width:100%;max-width:38px;border-radius:9px 9px 4px 4px;background:var(--gold);animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.bars .b i.zero{background:var(--line)}
.bars .b span{font-size:11px;color:var(--ink-3);font-weight:700;text-transform:capitalize}
.bars .b em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--ink-2);white-space:nowrap}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}}
.prog{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#F0C25C);border-radius:99px;transition:width .9s}

/* buttons */
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:15px;background:var(--money);color:#fff;width:100%;transition:transform .12s, filter .2s}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#241800}
.btn.danger{background:var(--spend-soft);color:var(--crit)}
.btn.sm{width:auto;padding:9px 13px;font-size:13px;border-radius:11px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:12px;color:var(--ink-3);font-size:10.5px;font-weight:700}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--money-2)}
.tab.on svg{transform:translateY(-1px)}
.tab.mid{visibility:hidden}
.fab{position:fixed;z-index:26;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:21px;border:0;background:var(--money);color:#fff;font-size:32px;line-height:1;box-shadow:0 10px 26px color-mix(in srgb,var(--money) 45%,transparent);display:grid;place-items:center;animation:bob 3.2s ease-in-out infinite}
.fab:active{transform:translateX(-50%) scale(.94)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(5,14,10,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-wrap.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1)}
.sheet-wrap.open .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-family:var(--f-display);font-size:21px;margin:0 0 14px;letter-spacing:-.02em}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{border:0;border-radius:11px;padding:10px;font-weight:800;background:transparent;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on.out{color:var(--spend)} .seg button.on.in{color:var(--money-2)}
.f{display:grid;gap:6px;margin-bottom:14px}
.f label{font-size:12px;font-weight:800;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:13px;padding:13px 14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--money-2);background:var(--surface)}
.money-inp{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.02em;text-align:center;padding:14px}
.grid-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gc{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink-2);min-width:0}
.gc span{font-size:21px}
.gc.on{border-color:var(--money-2);background:var(--money-soft);color:var(--ink);transform:scale(1.03)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.opt.on{border-color:var(--money-2);background:var(--money-soft)}
.hint{font-size:12.5px;color:var(--ink-3)}
.del-confirm{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--spend-soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;font-weight:700}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}

/* onboarding */
.ob{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.ob-in{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px}
.ob h1{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,9vw,44px);line-height:1.02;letter-spacing:-.035em;margin:0;text-wrap:balance}
.ob h1 em{font-style:normal;color:var(--money-2)}

.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line);transition:.4s}
.steps i.on{background:var(--money-2)}

.float-coins{position:relative;height:0}
.coin{position:absolute;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE59A,#E2A82A 60%,#B9800E);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 6px 14px rgba(185,128,14,.35);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#7a5200;font-size:18px;animation:hop 2.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-16px) rotate(-12deg)}60%{transform:translateY(-12px) rotate(8deg)}}
.bank-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bp{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bp i{width:26px;height:26px;border-radius:8px;display:block}
.bp.on{border-color:var(--money-2);background:var(--money-soft)}
.bp.on i{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--money-2)}

/* entrance */
.in{animation:enter .55s cubic-bezier(.2,.8,.2,1) both}

.btn.pulse.green{background:linear-gradient(135deg,#3CCB97,#14946C);color:#04170F}

#demoBar .t .po{color:#E5484D;text-decoration-thickness:2px;font-weight:700}#demoBar .t .p{color:#12A150;font-weight:900;font-size:14px}#demoBar .t b.vt{display:inline;font-size:12.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}

<script>
(function(){
"use strict";
/* ================= dados fixos ================= */
const BANKS=[
 {id:'nubank',n:'Nubank',c:'#820AD1'},{id:'itau',n:'Itaú',c:'#EC7000'},{id:'bradesco',n:'Bradesco',c:'#CC092F'},
 {id:'bb',n:'Banco do Brasil',c:'#F8D117',light:true},{id:'caixa',n:'Caixa',c:'#005CA9'},{id:'santander',n:'Santander',c:'#EC0000'},
 {id:'inter',n:'Inter',c:'#FF7A00'},{id:'c6',n:'C6 Bank',c:'#2B2B2B'},{id:'picpay',n:'PicPay',c:'#11C76F'},
 {id:'mp',n:'Mercado Pago',c:'#00A6E0'},{id:'neon',n:'Neon',c:'#0090FF'},{id:'next',n:'Next',c:'#00C853'},
 {id:'btg',n:'BTG',c:'#0B2A5B'},{id:'pan',n:'Banco Pan',c:'#00AEEF'},{id:'sicoob',n:'Sicoob',c:'#00534C'},
 {id:'outro',n:'Outro',c:'#5B6B63'}];
const CATS=[
 {id:'mercado',n:'Mercado',e:'🛒'},{id:'comida',n:'Comida',e:'🍔'},{id:'transporte',n:'Transporte',e:'🚌'},{id:'casa',n:'Casa',e:'🏠'},
 {id:'contas',n:'Contas',e:'💡'},{id:'saude',n:'Saúde',e:'💊'},{id:'lazer',n:'Lazer',e:'🎉'},{id:'compras',n:'Compras',e:'🛍️'},
 {id:'beleza',n:'Beleza',e:'💅'},{id:'educacao',n:'Estudos',e:'📚'},{id:'assinaturas',n:'Assinaturas',e:'📺'},{id:'pets',n:'Pets',e:'🐶'},
 {id:'filhos',n:'Filhos',e:'🧸'},{id:'presentes',n:'Presentes',e:'🎁'},{id:'dividas',n:'Dívidas',e:'📄'},{id:'outros',n:'Outros',e:'✨'}];
const METHODS=[{id:'pix',n:'Pix'},{id:'debito',n:'Débito'},{id:'dinheiro',n:'Dinheiro'},{id:'credito',n:'Crédito'},{id:'boleto',n:'Boleto'}];
const bank=id=>BANKS.find(b=>b.id===id)||BANKS[BANKS.length-1];
const cat=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];
const KEY='bolsoemdia:v1';
/* ====== VENDA: troque só estas 3 linhas ====== */
const CHECKOUT_URL='https://pay.kiwify.com.br/DgXIj7E';            // cole aqui o link do checkout (Kiwify, Hotmart...)
const ACCESS_CODE='BOLSO7391';    // código de acesso que o comprador recebe
const PRICE_OLD='R$ 59,90';      // preço riscado ("de")
const PRICE_TXT='R$ 24,90';       // preço que aparece na tela
/* ============================================== */
const ACC_KEY=KEY+':acesso';
const SUPPORT_WA='';               // seu WhatsApp para suporte, só números com DDD. Ex: '5531999999999' (vazio = esconde o botão)
const DEV_KEY=KEY+':aparelho';
function accRec(){try{const v=localStorage.getItem(ACC_KEY);if(!v)return null;if(v===ACCESS_CODE)return {st:'ok',legacy:true};const o=JSON.parse(v);return o&&typeof o==='object'?o:null}catch(e){return null}}
function hasAccess(){const a=accRec();return !!(a&&a.st==='ok')}
function deviceId(){try{let d=localStorage.getItem(DEV_KEY);if(!d){const a=new Uint8Array(12);(crypto&&crypto.getRandomValues)?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256|0);d='bd-'+Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem(DEV_KEY,d)}return d}catch(e){return 'bd-semstorage'}}
function setAcc(o){try{localStorage.setItem(ACC_KEY,JSON.stringify(o))}catch(e){}}
async function api(path,body){const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),15000);try{const r=await fetch('/api/'+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});let j={};try{j=await r.json()}catch(e){}return {status:r.status,...j}}finally{clearTimeout(tm)}}
const waLink=msg=>SUPPORT_WA?`https://wa.me/${SUPPORT_WA}?text=${encodeURIComponent(msg)}`:'';
function grantAccess(){try{localStorage.setItem(ACC_KEY,ACCESS_CODE)}catch(e){}}
function codeFromUrl(){try{const q=new URLSearchParams(location.search).get('acesso');if(q)return q.trim().toUpperCase();const h=(location.hash||'').replace('#','').trim().toUpperCase();return h||''}catch(e){return ''}}

/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmt0=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const today=new Date();
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const TODAYKEY=keyOf(today);
const addMonth=(k,n)=>{const [y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return keyOf(d)};
const mDiff=(a,b)=>{const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1)};
const monthName=(k,short)=>{const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('pt-BR',short?{month:'short'}:{month:'long',year:'numeric'}).replace('.','').replace(' de ',' ')};
const daysIn=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const isoToday=()=>today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= estado ================= */
let S=null, storageOK=true, cur=TODAYKEY, tab='inicio', demo=false;
function blank(){return {v:1,profile:{name:'',income:0,pct:20,onboarded:false},accounts:[],cards:[],fixed:[],months:{},goal:{name:'Reserva de emergência',target:500000}}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v)return o}}catch(e){storageOK=false}return null}
function save(){if(demo)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}
function M(k){k=k||cur;if(!S.months[k]){S.months[k]={income:S.profile.income,pct:S.profile.pct,extras:[],tx:[],paid:{},saved:false,savedValue:0}}return S.months[k]}
function peekM(k){return S.months[k]}

/* ================= cálculos ================= */
const fixedIn=k=>S.fixed.filter(f=>(!f.since||f.since<=k)&&(!f.until||k<=f.until)&&!(f.skip&&f.skip.includes(k)));
function calc(k){
  k=k||cur;const m=M(k);
  const extras=sum(m.extras.map(e=>e.value));const renda=m.income+extras;
  const meta=Math.round(renda*m.pct/100);
  const fx=fixedIn(k);const fixos=sum(fx.map(f=>f.value));
  const gastos=sum(m.tx.map(t=>t.value));const total=fixos+gastos;
  const pode=renda-meta;const livre=pode-total;
  const byCat={};m.tx.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.value);fx.forEach(f=>byCat[f.cat]=(byCat[f.cat]||0)+f.value);
  let dias=0;if(k===TODAYKEY)dias=daysIn(k)-today.getDate()+1;else if(k>TODAYKEY)dias=daysIn(k);
  const porDia=dias>0&&livre>0?Math.floor(livre/dias):0;
  const usedPct=pode>0?Math.round(total/pode*100):(total>0?100:0);
  return {renda,extras,meta,fixos,gastos,total,pode,livre,byCat,dias,porDia,usedPct,fx};
}
function cardFatura(cardId,k){const m=peekM(k);let v=m?sum(m.tx.filter(t=>t.cardId===cardId).map(t=>t.value)):0;v+=sum(fixedIn(k).filter(f=>f.cardId===cardId).map(f=>f.value));return v}
function cardUsed(cardId){let v=0;Object.keys(S.months).forEach(k=>{if(k>=TODAYKEY)v+=sum(S.months[k].tx.filter(t=>t.cardId===cardId).map(t=>t.value))});v+=sum(fixedIn(TODAYKEY).filter(f=>f.cardId===cardId).map(f=>f.value));return v}
function acctSpent(id,k){const m=peekM(k);return m?sum(m.tx.filter(t=>t.accountId===id).map(t=>t.value)):0}
function totalSaved(){return sum(Object.values(S.months).filter(m=>m.saved).map(m=>m.savedValue))+(S.goal.start||0)}

/* ================= animações ================= */
function countUp(root){(root||document).querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count;const f=el.dataset.fmt==='0'?fmt0:fmt;
  if(reduce){el.textContent=f(to);return}const from=+(el.dataset.from||0);const t0=performance.now(),D=900;
  const step=now=>{const k=Math.min(1,(now-t0)/D);const e=1-Math.pow(1-k,3);el.textContent=f(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
let lastHero=0;
function confetti(){if(reduce)return;const cv=$('#confetti');const ctx=cv.getContext('2d');const dpr=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.scale(dpr,dpr);
  const cols=['#14946C','#F2B64A','#3CCB97','#E4573F','#FFE59A','#0E6B4F'];const P=[];for(let i=0;i<140;i++)P.push({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.55,vx:(Math.random()-.5)*13,vy:-Math.random()*15-6,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.3,coin:Math.random()<.18});
  const t0=performance.now();(function f(now){ctx.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.42;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
    if(p.coin){ctx.fillStyle='#E2A82A';ctx.beginPath();ctx.ellipse(0,0,p.r*1.3,p.r*1.3*Math.abs(Math.cos(p.a*2))+1,0,0,7);ctx.fill()}else{ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2)}ctx.restore()});
    if(now-t0<2800)requestAnimationFrame(f);else ctx.clearRect(0,0,innerWidth,innerHeight)})(t0)}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

/* ================= campo de dinheiro ================= */
function moneyField(id,cents,big){return `<input id="${id}" class="inp ${big?'money-inp':''} num" inputmode="numeric" autocomplete="off" data-money="${cents||0}" value="${cents?fmt(cents):''}" placeholder="R$ 0,00">`}
function bindMoney(root){root.querySelectorAll('[data-money]').forEach(el=>{el.addEventListener('input',()=>{const d=el.value.replace(/\D/g,'').slice(0,11);const c=+d||0;el.dataset.money=c;el.value=c?fmt(c):'';});
  el.addEventListener('focus',()=>{setTimeout(()=>{try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}},0)})})}
const getMoney=id=>+(document.getElementById(id)?.dataset.money||0);

/* ================= render principal ================= */
function render(){
  $('#mLabel').textContent=monthName(cur);
  document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const v=$('#view');
  let html='';
  if(demo)html+=`<div class="banner in"><span>👀 <b>Exemplo:</b> toque no <b>+</b> lá embaixo e anote um gasto de teste. Nada aqui é salvo.</span><button data-a="leaveDemo">Quero o meu</button></div>`;
  else if(!storageOK)html+=`<div class="banner"><span>Este navegador não está deixando salvar. Saia da aba anônima para seus dados ficarem guardados.</span></div>`;
  html+=({inicio:vInicio,gastos:vGastos,cartoes:vCartoes,guardar:vGuardar,ajustes:vAjustes,corrida:vCorrida}[tab])();
  v.innerHTML=html;countUp(v);
}

function vInicio(){
  const c=calc();const m=M();const neg=c.livre<0;
  const name=S.profile.name?esc(S.profile.name.split(' ')[0]):'';
  const R=44,C=2*Math.PI*R,used=Math.min(100,Math.max(0,c.usedPct));
  const w=x=>c.renda>0?Math.max(0,x/c.renda*100):0;
  const livreW=Math.max(0,c.livre);
  let sub='';
  if(c.renda===0)sub=`Coloque quanto você recebe este mês para o app calcular seu limite.`;
  else if(neg)sub=`Você passou <b>${fmt(-c.livre)}</b> do que podia gastar sem mexer no dinheiro que ia guardar.`;
  else if(c.dias>0)sub=`Dá para gastar até <b>${fmt(c.porDia)} por dia</b> pelos próximos ${c.dias} ${c.dias===1?'dia':'dias'}.`;
  else sub=cur<TODAYKEY?`Este mês já fechou. Sobrou ${fmt(c.livre)} além do que você guardou.`:'';
  const alerts=buildAlerts(c);
  const recent=[...m.tx.map(t=>({...t,kind:'out'})),...m.extras.map(e=>({...e,kind:'in'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0)).slice(0,5);
  const cats=Object.entries(c.byCat).sort((a,b)=>b[1]-a[1]);const maxCat=cats[0]?cats[0][1]:1;
  return `
  <div class="in" style="margin:4px 0 12px;display:flex;justify-content:space-between;align-items:end;gap:10px">
    <div><div style="font-size:13px;color:var(--ink-3);font-weight:700">${greet()}${name?', '+name:''}</div>
    <div style="font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em">Seu mês de ${monthName(cur,true)}</div></div>
    <button class="link" data-a="tab" data-v="ajustes">Ajustes</button>
  </div>
  <div class="hero in ${neg?'neg':''}" style="animation-delay:.05s">
    <div class="hero-row">
      <div style="min-width:0">
        <small>${neg?'Passou do limite em':'Você ainda pode gastar'}</small>
        <div class="big num" data-count="${Math.abs(c.livre)}" data-from="${lastHero}">${fmt(Math.abs(c.livre))}</div>
      </div>
      <div class="ring" aria-label="${used}% do limite usado">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${R}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="10"/>
        <circle cx="50" cy="50" r="${R}" fill="none" stroke="${neg?'#FFD3C9':'#7FF0C2'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-ring="${C*(1-used/100)}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"/></svg>
        <div class="pct num">${c.usedPct}%<em>USADO</em></div>
      </div>
    </div>
    <div class="sub">${sub}</div>
    <div class="stack" aria-hidden="true">
      <i style="width:${w(c.meta)}%;background:#F2B64A"></i><i style="width:${w(c.fixos)}%;background:#B8D4C7"></i><i style="width:${w(c.gastos)}%;background:#FF8C75"></i><i style="width:${w(livreW)}%;background:#7FF0C2"></i>
    </div>
    <div class="legend num">
      <div><span class="dot" style="background:#F2B64A"></span>Guardar<b>${fmt0(c.meta)}</b></div>
      <div><span class="dot" style="background:#B8D4C7"></span>Fixas<b>${fmt0(c.fixos)}</b></div>
      <div><span class="dot" style="background:#FF8C75"></span>Gastos<b>${fmt0(c.gastos)}</b></div>
      <div><span class="dot" style="background:#7FF0C2"></span>Livre<b>${fmt0(livreW)}</b></div>
    </div>
  </div>
  <div class="stats in" style="animation-delay:.12s">
    <button class="stat" data-a="editIncome"><small>Renda do mês</small><b class="num" data-count="${c.renda}" data-fmt="0">${fmt0(c.renda)}</b><span class="edit">editar</span></button>
    <div class="stat"><small>Já gastei</small><b class="num" style="color:var(--spend)" data-count="${c.total}" data-fmt="0">${fmt0(c.total)}</b><span class="hint">fixas + gastos</span></div>
    <button class="stat" data-a="tab" data-v="guardar"><small>Vou guardar</small><b class="num" style="color:var(--gold)" data-count="${c.meta}" data-fmt="0">${fmt0(c.meta)}</b><span class="edit">${m.pct}% da renda</span></button>
  </div>
  ${alerts.length?`<div class="alerts in" style="animation-delay:.18s">${alerts.map(a=>`<div class="alert ${a.k}"><span class="ic">${a.i}</span><span>${a.t}</span></div>`).join('')}</div>`:''}
  <section class="blk in" style="animation-delay:.22s">
    <div class="blk-h"><h2>Contas fixas do mês</h2><button class="link" data-a="newFixed">+ Adicionar</button></div>${c.fx.length?`<span class="hint" style="display:block;margin:-4px 0 8px">Toque para marcar como paga. Para editar ou excluir, segure a conta ou toque no ⋯</span>`:''}
    <div class="panel list">${c.fx.length?c.fx.sort((a,b)=>(a.day||0)-(b.day||0)).map(f=>{const paid=!!m.paid[f.id];return `
      <div class="fxrow"><button class="item ${paid?'paid':''}" data-a="togglePaid" data-id="${f.id}" data-hold="editFixed" aria-pressed="${paid}">
        <span class="check">✓</span>
        <span class="mid"><span class="t">${cat(f.cat).e} ${esc(f.desc)}</span><span class="s">${f.day?'vence dia '+f.day:'sem dia fixo'} · ${payLabel(f)}${f.until?(f.until===cur?' · <span class="tagend">último mês</span>':` · <span class="tagend" style="color:var(--ink-2);background:var(--surface-2)">faltam ${mDiff(cur,f.until)+1}</span>`):''}</span></span>
        <span class="v num">${fmt(f.value)}</span></button><button class="fxmore" data-a="editFixed" data-id="${f.id}" aria-label="Editar ou excluir ${esc(f.desc)}">⋯</button></div>`}).join(''):emptyBox('📌','Nenhuma conta fixa ainda','Aluguel, luz, internet, celular… Cadastre uma vez e ela aparece todo mês.')}</div>
  </section>
  <section class="blk in" style="animation-delay:.28s">
    <div class="blk-h"><h2>Para onde foi o dinheiro</h2></div>
    <div class="panel cats">${cats.length?cats.map(([id,v],i)=>`<div class="cat"><span style="font-size:22px">${cat(id).e}</span>
      <div style="min-width:0"><div class="n"><span style="color:var(--ink);font-size:13.5px;font-weight:700">${cat(id).n}</span><span class="num">${c.total?Math.round(v/c.total*100):0}%</span></div><div class="bar"><i style="width:${v/maxCat*100}%;animation-delay:${.05*i}s"></i></div></div>
      <b class="num" style="font-size:13.5px">${fmt0(v)}</b></div>`).join(''):emptyBox('📊','Sem gastos ainda','Quando você anotar seus gastos, eles aparecem aqui separados por categoria.')}</div>
  </section>
  <section class="blk in" style="animation-delay:.34s">
    <div class="blk-h"><h2>Últimos lançamentos</h2>${recent.length?'<button class="link" data-a="tab" data-v="gastos">Ver todos</button>':''}</div>
    <div class="panel list">${recent.length?recent.map(itemRow).join(''):emptyBox('✍️','Comece anotando','Toque no <strong>+</strong> lá embaixo e anote seu primeiro gasto. Leva 5 segundos.')}</div>
  </section>
  <p class="foot">Seus dados ficam salvos só neste celular.</p>`;
}
function greet(){const h=today.getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}
function emptyBox(i,t,s){return `<div class="empty"><div class="e-ic">${i}</div><b>${t}</b><div style="font-size:13.5px">${s}</div></div>`}
function payLabel(t){const mth=METHODS.find(x=>x.id===t.method);let s=mth?mth.n:'';
  if(t.cardId){const cd=S.cards.find(x=>x.id===t.cardId);if(cd)s=`Crédito ${esc(cd.nick||bank(cd.bank).n)}`}
  else if(t.accountId){const a=S.accounts.find(x=>x.id===t.accountId);if(a)s+=` · ${esc(a.nick||bank(a.bank).n)}`}
  return s}
function bankDotFor(t){let b=null;if(t.cardId){const cd=S.cards.find(x=>x.id===t.cardId);if(cd)b=bank(cd.bank)}else if(t.accountId){const a=S.accounts.find(x=>x.id===t.accountId);if(a)b=bank(a.bank)}return b?`<span class="bank-dot" style="background:${b.c}"></span>`:''}
function itemRow(t){const inn=t.kind==='in';const d=t.date?t.date.slice(8,10)+'/'+t.date.slice(5,7):'';
  return `<button class="item" data-a="${inn?'editExtra':'editTx'}" data-id="${t.id}">
    <span class="emo" style="${inn?'background:var(--money-soft)':''}">${inn?'💰':cat(t.cat).e}</span>
    <span class="mid"><span class="t">${esc(t.desc||(inn?'Entrada':cat(t.cat).n))}</span><span class="s">${d}${inn?' · entrada':` · ${bankDotFor(t)} ${payLabel(t)}`}${t.inst?` <span class="chip">${t.inst}</span>`:''}</span></span>
    <span class="v num ${inn?'in':'out'}">${inn?'+ ':'− '}${fmt(t.value)}</span></button>`}
function buildAlerts(c){const a=[];const m=M();
  if(c.renda===0)a.push({k:'',i:'👋',t:'Toque em <b>Renda do mês</b> para colocar quanto você recebe.'});
  if(c.renda>0&&c.livre<0)a.push({k:'crit',i:'🚨',t:`Os gastos já passaram do limite. Para guardar os ${m.pct}% este mês, segure as compras até o mês que vem.`});
  else if(c.renda>0&&c.usedPct>=80)a.push({k:'',i:'⚠️',t:`Você já usou ${c.usedPct}% do que podia gastar este mês. Vai com calma.`});
  if(cur===TODAYKEY){const d=today.getDate();c.fx.forEach(f=>{if(!m.paid[f.id]&&f.day&&f.day>=d&&f.day-d<=3)a.push({k:'',i:'📅',t:`<b>${esc(f.desc)}</b> vence ${f.day===d?'hoje':'dia '+f.day} (${fmt(f.value)}).`})});
    c.fx.forEach(f=>{if(!m.paid[f.id]&&f.day&&f.day<d)a.push({k:'crit',i:'⏰',t:`<b>${esc(f.desc)}</b> venceu dia ${f.day} e ainda não está marcada como paga.`})})}
  S.cards.forEach(cd=>{if(!cd.limit)return;const u=cardUsed(cd.id)/cd.limit;if(u>=.8)a.push({k:u>=1?'crit':'',i:'💳',t:`Cartão ${esc(cd.nick||bank(cd.bank).n)} com ${Math.round(u*100)}% do limite usado.`})});
  if(c.renda>0&&c.livre>=0&&c.total>0&&c.usedPct<50&&cur===TODAYKEY&&today.getDate()>=15)a.push({k:'ok',i:'🌱',t:'Passou da metade do mês gastando menos da metade. Mandou bem!'});
  return a.slice(0,4)}

function vGastos(){
  const m=M();const all=[...m.tx.map(t=>({...t,kind:'out'})),...m.extras.map(e=>({...e,kind:'in'}))];
  const f=window.__filter||'todos';
  const list=all.filter(t=>f==='todos'?true:f==='entradas'?t.kind==='in':t.kind==='out'&&t.cat===f).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0));
  const used=[...new Set(m.tx.map(t=>t.cat))];
  const groups={};list.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t)});
  const c=calc();
  return `<div class="in" style="margin:6px 0 12px"><div style="font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em">Lançamentos</div>
   <div class="hint">${m.tx.length} gastos · ${m.extras.length} entradas · total gasto ${fmt(c.gastos)} (fora as fixas)</div></div>
  <div class="pills in" style="margin-bottom:6px">
    <button class="pill ${f==='todos'?'on':''}" data-a="filter" data-v="todos">Todos</button>
    <button class="pill ${f==='entradas'?'on':''}" data-a="filter" data-v="entradas">💰 Entradas</button>
    ${used.map(id=>`<button class="pill ${f===id?'on':''}" data-a="filter" data-v="${id}">${cat(id).e} ${cat(id).n}</button>`).join('')}
  </div>
  ${list.length?Object.keys(groups).sort().reverse().map(d=>`<div class="day-h"><span>${dayLabel(d)}</span><span class="num">${fmt(sum(groups[d].filter(t=>t.kind==='out').map(t=>t.value)))}</span></div>
    <div class="panel list in">${groups[d].map(itemRow).join('')}</div>`).join(''):`<div class="panel in" style="margin-top:10px">${emptyBox('🧾','Nada por aqui ainda','Toque no + para anotar um gasto ou uma entrada de dinheiro.')}</div>`}`;
}
function dayLabel(d){if(!d)return 'Sem data';const dt=new Date(d+'T12:00:00');const t=isoToday();if(d===t)return 'Hoje';const y=new Date(today);y.setDate(y.getDate()-1);if(d===keyOf(y)+'-'+pad(y.getDate()))return 'Ontem';
  return dt.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}).replace(/\./g,'')}

     <span class="emo" style="background:${b.c};color:${b.light?'#222':'#fff'};font-family:var(--f-display);font-weight:800;font-size:15px">${esc(b.n.slice(0,2).toUpperCase())}</span>

     <span style="text-align:right"><span class="v num" style="display:block">${fmt(a.balance||0)}</span><span class="hint">saldo</span></span></button>`}).join(''):emptyBox('🏦','Nenhuma conta','Adicione onde seu dinheiro fica: Nubank, Itaú, Caixa… e anote o saldo.')}</div></section>`;

function vGuardar(){
  const m=M();const c=calc();const tot=totalSaved();const g=S.goal;const gp=g.target?Math.min(100,tot/g.target*100):0;
  const ks=[];for(let i=5;i>=0;i--)ks.push(addMonth(cur,-i));const vals=ks.map(k=>{const mm=peekM(k);return mm&&mm.saved?mm.savedValue:0});const mx=Math.max(...vals,1);
  return `<div class="in" style="margin:6px 0 14px"><div style="font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em">Guardar dinheiro</div><div class="hint">Separe primeiro, gaste depois. É assim que sobra.</div></div>
  <div class="gold-hero in">
    <small>Meta de ${monthName(cur,true)}</small>
    <div class="big num" data-count="${c.meta}">${fmt(c.meta)}</div>
    <div class="hint" style="color:var(--ink-2)"><b id="pctTxt">${m.pct}%</b> de ${fmt(c.renda)} · em 12 meses dá <b class="num">${fmt0(c.meta*12)}</b></div>
    <input type="range" class="range" id="pctRange" min="0" max="50" step="1" value="${m.pct}" aria-label="Porcentagem para guardar">
    <div class="pills">${[5,10,15,20,30].map(p=>`<button class="pill ${m.pct===p?'on':''}" data-a="setPct" data-v="${p}">${p}%</button>`).join('')}</div>
    <div style="margin-top:16px">${m.saved?`<button class="btn ghost" data-a="unsave">✓ Você guardou ${fmt(m.savedValue)} este mês · desfazer</button>`:`<button class="btn gold" data-a="markSaved">Já separei esse dinheiro</button>`}</div>
  </div>
  <section class="blk in" style="animation-delay:.1s"><div class="blk-h"><h2>${esc(g.name)}</h2><button class="link" data-a="editGoal">editar</button></div>
    <div class="panel" style="padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px"><div style="font-family:var(--f-display);font-weight:800;font-size:26px" class="num" data-count="${tot}">${fmt(tot)}</div><div class="hint num">de ${fmt0(g.target)}</div></div>
      <div class="prog"><i style="width:${gp}%"></i></div>
      <div class="hint" style="margin-top:8px">${g.target?(gp>=100?'Meta batida! 🎉 Que tal criar a próxima?':`Faltam ${fmt(g.target-tot)}${c.meta>0?` · uns ${Math.ceil((g.target-tot)/c.meta)} meses guardando ${fmt0(c.meta)}`:''}.`):'Defina um valor para acompanhar.'}</div>
    </div></section>
  <section class="blk in" style="animation-delay:.16s"><div class="blk-h"><h2>Quanto guardei por mês</h2></div>
    <div class="panel bars">${ks.map((k,i)=>`<div class="b"><em class="num">${vals[i]?fmt0(vals[i]):''}</em><i class="${vals[i]?'':'zero'}" style="height:${vals[i]?Math.max(6,vals[i]/mx*100):4}%;animation-delay:${i*.06}s"></i><span>${monthName(k,true)}</span></div>`).join('')}</div></section>
  <section class="blk in" style="animation-delay:.2s"><div class="panel" style="padding:16px">
    <div style="font-weight:800;margin-bottom:6px">💡 Dica: regra 50 · 30 · 20</div>
    <div class="hint" style="font-size:13.5px;color:var(--ink-2)">50% para o essencial (casa, contas, mercado), 30% para o que você gosta e 20% para guardar. Se 20% ainda pesa, comece com 5% e vá subindo.</div></div></section>`;
}

function vAjustes(){const p=S.profile;

function getTheme(){try{return localStorage.getItem(KEY+':theme')||'auto'}catch(e){return 'auto'}}

function openSheet(html,mount){const s=$('#sheet');s.innerHTML='<div class="grab"></div>'+html;bindMoney(s);const w=$('#sheetWrap');w.classList.add('open');w.setAttribute('aria-hidden','false');mount&&mount(s);
  setTimeout(()=>{const f=s.querySelector('[data-autofocus]');if(f)f.focus({preventScroll:true})},380)}
function closeSheet(){const w=$('#sheetWrap');w.classList.remove('open');w.setAttribute('aria-hidden','true')}

function txSheet(tx,kindIn){
  const isEdit=!!tx;tx=tx||{value:0,desc:'',cat:'mercado',method:'pix',date:isoToday()};
  let kind=kindIn||'out', sel={cat:tx.cat,method:tx.cardId?'credito':tx.method||'pix',card:tx.cardId||(S.cards[0]&&S.cards[0].id),acct:tx.accountId||(S.accounts[0]&&S.accounts[0].id),inst:1};
  const dflt=tx.date&&tx.date.slice(0,7)===cur?tx.date:(cur===TODAYKEY?isoToday():cur+'-01');
  const draw=()=>{const credit=sel.method==='credito';const acctM=['pix','debito','boleto'].includes(sel.method);
   return `${isEdit?'':`<div class="seg"><button class="${kind==='out'?'on out':''}" data-s="kind" data-v="out">Gasto</button><button class="${kind==='in'?'on in':''}" data-s="kind" data-v="in">Entrada</button></div>`}
   <h3>${isEdit?(kind==='in'?'Editar entrada':'Editar gasto'):kind==='in'?'Entrou dinheiro':'Anotar gasto'}</h3>
   <div class="f">${moneyField('txV',tx.value,true).replace('<input','<input data-autofocus aria-label="Valor"')}</div>
   <div class="f"><label for="txD">${kind==='in'?'De onde veio':'O que foi'}</label><input id="txD" class="inp" maxlength="60" value="${esc(tx.desc)}" placeholder="${kind==='in'?'Ex: freela, venda, 13º':'Ex: mercado do mês, Uber, iFood'}"></div>
   ${kind==='out'?`<div class="f"><label>Categoria</label><div class="grid-cats">${CATS.map(c=>`<button type="button" class="gc ${sel.cat===c.id?'on':''}" data-s="cat" data-v="${c.id}"><span>${c.e}</span>${c.n}</button>`).join('')}</div></div>
   <div class="f"><label>Como pagou</label><div class="opts">${METHODS.map(x=>`<button type="button" class="opt ${sel.method===x.id?'on':''}" data-s="method" data-v="${x.id}">${x.n}</button>`).join('')}</div></div>
   ${credit?(S.cards.length?`<div class="f"><label>Qual cartão</label><div class="opts">${S.cards.map(cd=>`<button type="button" class="opt ${sel.card===cd.id?'on':''}" data-s="card" data-v="${cd.id}"><span class="bank-dot" style="background:${bank(cd.bank).c}"></span>${esc(cd.nick||bank(cd.bank).n)}</button>`).join('')}</div></div>
      ${isEdit?'':`<div class="f"><label for="txI">Parcelas</label><select id="txI" class="inp">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${sel.inst===i+1?'selected':''}>${i===0?'À vista':(i+1)+'x'}</option>`).join('')}</select><span class="hint">Parcelado: cada parcela entra no mês dela.</span></div>`}`
      :`<div class="hint" style="margin:-6px 0 14px">Você ainda não tem cartão cadastrado. <button class="link" data-a="newCard">Cadastrar cartão</button></div>`):''}
   ${acctM&&S.accounts.length?`<div class="f"><label>Saiu de qual conta</label><div class="opts">${S.accounts.map(a=>`<button type="button" class="opt ${sel.acct===a.id?'on':''}" data-s="acct" data-v="${a.id}"><span class="bank-dot" style="background:${bank(a.bank).c}"></span>${esc(a.nick||bank(a.bank).n)}</button>`).join('')}</div></div>`:''}`:''}
   <div class="f"><label for="txDate">Data</label><input id="txDate" class="inp" type="date" value="${dflt}"></div>
   <button class="btn" data-s="save">${isEdit?'Salvar':kind==='in'?'Adicionar entrada':'Anotar gasto'}</button>
   ${isEdit?`<div id="delBox" style="margin-top:10px"><button class="btn danger" data-s="del">Excluir</button></div>`:''}`};
  const keep=()=>({v:getMoney('txV'),d:$('#txD')?.value,dt:$('#txDate')?.value,i:+($('#txI')?.value||1)});
  const redraw=s=>{const k=keep();tx.value=k.v;tx.desc=k.d;sel.inst=k.i;if(k.dt)tx.date=k.dt;s.innerHTML='<div class="grab"></div>'+draw();bindMoney(s)};
  openSheet(draw(),s=>{s.onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;const k=b.dataset.s;
    if(k==='kind'){kind=b.dataset.v;redraw(s)}
    else if(['cat','method','card','acct'].includes(k)){sel[k]=b.dataset.v;redraw(s)}
    else if(k==='save'){const v=getMoney('txV');if(!v){toast('Coloque o valor');return}
      const desc=$('#txD').value.trim();const date=$('#txDate').value||isoToday();const mk=date.slice(0,7);
      if(kind==='in'){if(isEdit){Object.assign(tx,{value:v,desc,date});moveIfNeeded(tx,'extras',mk)}else M(mk).extras.push({id:uid(),value:v,desc,date,ts:Date.now()})}
      else{const base={desc,cat:sel.cat,method:sel.method,cardId:sel.method==='credito'?sel.card||null:null,accountId:['pix','debito','boleto'].includes(sel.method)?sel.acct||null:null};
        if(isEdit){Object.assign(tx,base,{value:v,date});moveIfNeeded(tx,'tx',mk)}
        else{const n=sel.method==='credito'?(+($('#txI')?.value||1)):1;const g=uid();const each=Math.floor(v/n);
          for(let i=0;i<n;i++){const k2=addMonth(mk,i);const val=i===n-1?v-each*(n-1):each;const d2=k2+date.slice(7);
            M(k2).tx.push(Object.assign({},base,{id:uid(),value:val,date:i?(k2+'-'+pad(Math.min(+date.slice(8,10),daysIn(k2)))):date,ts:Date.now(),group:n>1?g:null,inst:n>1?`${i+1}/${n}`:null}))}}}
      save();closeSheet();if(!isEdit&&mk!==cur&&tab==='inicio'){}render();toast(isEdit?'Salvo':kind==='in'?'Entrada anotada 💰':'Gasto anotado ✓');}
    else if(k==='del'){$('#delBox').innerHTML=`<div class="del-confirm"><span>${tx.group?'Excluir todas as parcelas?':'Excluir mesmo?'}</span><span class="row" style="flex:none;gap:6px"><button class="btn sm ghost" data-s="delNo">Não</button><button class="btn sm danger" data-s="delYes">Excluir</button></span></div>`}
    else if(k==='delNo'){$('#delBox').innerHTML=`<button class="btn danger" data-s="del">Excluir</button>`}
    else if(k==='delYes'){Object.values(S.months).forEach(mm=>{mm.tx=mm.tx.filter(t=>t.id!==tx.id&&!(tx.group&&t.group===tx.group));mm.extras=mm.extras.filter(t=>t.id!==tx.id)});save();closeSheet();render();toast('Excluído')}
  }});
}
function moveIfNeeded(item,field,mk){Object.keys(S.months).forEach(k=>{if(k!==mk){const arr=S.months[k][field];const i=arr.findIndex(x=>x.id===item.id);if(i>=0){arr.splice(i,1);M(mk)[field].push(item)}}})}
function findTx(id){for(const k in S.months){const t=S.months[k].tx.find(x=>x.id===id);if(t)return t}return null}
function findExtra(id){for(const k in S.months){const t=S.months[k].extras.find(x=>x.id===id);if(t)return t}return null}

function fixedSheet(f){const isEdit=!!f;f=f||{desc:'',value:0,cat:'contas',day:'',method:'boleto'};const base=isEdit&&f.since?f.since:cur;let untilV=f.until||'';let sel={cat:f.cat,method:f.cardId?'credito':f.method,card:f.cardId||(S.cards[0]&&S.cards[0].id),acct:f.accountId||(S.accounts[0]&&S.accounts[0].id)};

   <div class="f"><label for="fD">Nome</label><input id="fD" class="inp" value="${esc(f.desc)}" placeholder="Ex: Aluguel, Luz, Internet" data-autofocus></div>

    if(k==='save'){keep();if(!f.desc.trim()||!f.value){toast('Coloque o nome e o valor');return}
      const o={desc:f.desc.trim(),value:f.value,day:+f.day||'',cat:sel.cat,method:sel.method,cardId:sel.method==='credito'?sel.card||null:null,accountId:null};if(untilV)o.until=untilV;else delete f.until;
      if(isEdit)Object.assign(f,o);else S.fixed.push(Object.assign({id:uid(),since:cur},o));save();closeSheet();render();toast('Conta fixa salva 📌')}
    const delBtn=`<button class="btn danger" data-s="del">Excluir</button>`;
    if(k==='del'){$('#delBox').innerHTML=`<div class="delopts"><b>O que você quer excluir?</b>

      <button class="btn sm ghost" style="margin-top:2px" data-s="delNo">Cancelar</button></div>`}
    if(k==='delNo'){$('#delBox').innerHTML=delBtn}
    if(k==='delMonth'){f.skip=(f.skip||[]).filter(x=>x!==cur).concat(cur);const m=peekM(cur);if(m&&m.paid)delete m.paid[f.id];save();closeSheet();render();toast(`Tirada só de ${monthName(cur,true)} ✓`)}
    if(k==='delFwd'){const u=addMonth(cur,-1);if(!f.since||u<f.since){S.fixed=S.fixed.filter(x=>x.id!==f.id)}else{f.until=u;if(f.skip)f.skip=f.skip.filter(x=>x<=u)}const m=peekM(cur);if(m&&m.paid)delete m.paid[f.id];save();closeSheet();render();toast(`Excluída de ${monthName(cur,true)} em diante ✓`)}

  }})}

  if(r.status===0)return say('Parece que você está sem internet. Conecte e tente de novo.','err');

function CD(d){const c=CR();if(!c.days[d])c.days[d]={g:[],x:[],km:0,ini:'',fim:''};return c.days[d]}
function cPeek(d){return CR().days[d]}
const shiftDay=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
const dShort=d=>d.slice(8,10)+'/'+d.slice(5,7);
function dLabel(d){const t=isoToday();if(d===t)return 'Hoje';if(d===shiftDay(t,-1))return 'Ontem';return new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'})}
function hrs(a,b){if(!a||!b)return 0;const [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);let m=(h2*60+m2)-(h1*60+m1);if(m<0)m+=1440;return m/60}
function custoKm(){const c=CR().cfg;return (c.kmL>0?c.fuel/c.kmL:0)+(+c.res||0)}  // centavos por km
function cCalc(d){const day=cPeek(d)||{g:[],x:[],km:0};const fat=sum(day.g.map(i=>i.v)),gas=sum(day.x.map(i=>i.v));const h=hrs(day.ini,day.fim);
  return {fat,gas,lucro:fat-gas,h,km:+day.km||0,porHora:h>0?(fat-gas)/h:0,porKm:day.km>0?fat/day.km:0,has:(day.g.length+day.x.length)>0||day.km>0}}
const fmtH=h=>{const H=Math.floor(h),M=Math.round((h-H)*60);return H+'h'+(M?pad(M):'')};
